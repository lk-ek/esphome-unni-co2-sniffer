esphome:
  name: i2csniffer
  friendly_name: I2C-Sniffer SHT43 Probe

external_components:
  - source:
      type: local
      path: .

logger:
  level: VERBOSE
  initial_level: DEBUG
  logs:
    api: VERBOSE
    api.connection: VERBOSE

api:
  encryption:
    key: !secret i2csniffer__encryption_key

ota:
  - platform: esphome
    password: !secret i2csniffer__ota
    allow_partition_access: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Keep Wi-Fi modem sleep conservative while automatic MCU Light-sleep is used.
  # HIGH/MAX_MODEM proved unreliable on this ESP32-C3/AP combination.
  power_save_mode: LIGHT
  # Skip the normal active channel scan on reconnect/boot. ESPHome falls back
  # to scanning automatically if the remembered AP cannot be reached.
  fast_connect: false
  # Stationary device with multiple APs: avoid disruptive BSSID roaming.
  post_connect_roaming: false
  ap:
    ssid: "I2CSniffer Fallback Hotspot"
    password: !secret i2csniffer__ap_password

captive_portal:

web_server:
  port: 80

# Match the SHT43 DemoBoard security model closely enough to probe
# MyAmbience pairing and Device Settings behavior.
esp32_ble:
  io_capability: display_yes_no
  auth_req_mode: sc_mitm_bond
  min_key_size: 10
  max_key_size: 16

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

co2_monitor_0601:
  home_assistant: true
  # Experimental identity only: advertise as a new SHT43 DemoBoard so
  # MyAmbience cannot reuse the cached SCD-Gadget classification.
  # A/B test: the SHT43-specific GATT services are intentionally disabled in
  # C++ while identity/advertising/security and Sensirion history stay active.
  sht43_identity_probe: true
  # Force battery-style runtime policy while physically powered by USB.
  # Toggle the Energy Save Mode switch in Home Assistant for power measurements.
  energy_save_mode_default: false
  # Keep HA/API reachable briefly before Light-sleep may drop native USB serial.
  energy_save_grace: 3s
  sniffer_start_delay: 10s
  debug_metrics: true
  debug_capture: true

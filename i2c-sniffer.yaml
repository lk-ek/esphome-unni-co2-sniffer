esphome:
  name: i2csniffer
  friendly_name: I2C-Sniffer

external_components:
  - source:
      type: local
      path: .

logger:
  level: INFO

api:
  encryption:
    key: !secret i2csniffer__encryption_key

ota:
  - platform: esphome
    password: !secret i2csniffer__ota

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "I2CSniffer Fallback Hotspot"
    password: !secret i2csniffer__ap_password

captive_portal:

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

# BLE host used by the custom Sensirion MyCO2 manufacturer advertisement.
# No GATT server is required for live broadcasts.
esp32_ble:
  name: "Unni-CO2"
  advertising: true

web_server:
  port: 80

bus_sniffer:
  co2:
    name: "CO2"
    id: cd40_co2
    icon: mdi:molecule-co2

  crc_errors:
    name: "CO2 Sniffer CRC Errors"

  frame_errors:
    name: "CO2 Sniffer Frame Errors"

  rt_temperature:
    name: "RT Temperature"
    id: rt_temperature
    icon: mdi:thermometer

  rh_humidity:
    name: "RH Humidity"
    id: rh_humidity
    icon: mdi:water-percent

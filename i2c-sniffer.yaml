esphome:
  name: i2csniffer
  friendly_name: I2C-Sniffer


external_components:
  - source:
      type: local
      path: .

# Enable logging
logger:
  level: INFO

# Enable Home Assistant API
api:
  encryption:
    key: !secret i2csniffer__encryption_key

ota:
  - platform: esphome
    password: !secret i2csniffer__ota

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "I2CSniffer Fallback Hotspot"
    password: !secret i2csniffer__ap_password

captive_portal:



esp32:
  board: esp32-s2-saola-1
  framework:
    type: esp-idf



web_server:
  port: 80

bus_sniffer:
  co2:
    name: "CO2"
    id: cd40_co2
    icon: mdi:molecule-co2

  crc_errors:
    name: "CO2 Sniffer CRC Errors"

  frame_errors:
    name: "CO2 Sniffer Frame Errors"

  rt_temperature:
    name: "RT Temperature"
    icon: mdi:thermometer

  # Temporary ADC diagnostics for the four RT/RH test points.
  # Values are raw ADC counts; min/max are additionally logged every 2 s.
  probe_gpio10:
    name: "Probe GPIO10 ADC"

  probe_gpio11:
    name: "Probe GPIO11 ADC"

  probe_gpio12:
    name: "Probe GPIO12 ADC"

  probe_gpio13:
    name: "Probe GPIO13 ADC"

  adc_read_errors:
    name: "Probe ADC Read Errors"

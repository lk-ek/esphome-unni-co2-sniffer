esphome:
  name: i2csniffer
  friendly_name: I2C-Sniffer


external_components:
  - source:
      type: local
      path: .

# Enable logging
logger:
  level: INFO

# Enable Home Assistant API
api:
  encryption:
    key: !secret i2csniffer__encryption_key

ota:
  - platform: esphome
    password: !secret i2csniffer__ota

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "I2CSniffer Fallback Hotspot"
    password: !secret i2csniffer__ap_password

captive_portal:



esp32:
  board: esp32-s2-saola-1
  framework:
    type: esp-idf



web_server:
  port: 80

bus_sniffer:
  co2:
    name: "CO2"
    id: cd40_co2
    icon: mdi:molecule-co2

  crc_errors:
    name: "CO2 Sniffer CRC Errors"

  frame_errors:
    name: "CO2 Sniffer Frame Errors"

  # RT/RH test points on GPIO10..13 are captured passively as digital edges.
  # The first edge starts a 500 ms capture. Download the frozen capture at:
  #   http://<device>/rt_rh_capture.csv
  # Downloading rearms the RT/RH capture for the next measurement cycle.

esphome:
  name: i2csniffer
  friendly_name: I2C-Sniffer
  includes:
    - <esp_mac.h>

external_components:
  - source:
      type: local
      path: .

logger:
  level: INFO

api:
  encryption:
    key: !secret i2csniffer__encryption_key

ota:
  - platform: esphome
    password: !secret i2csniffer__ota
    allow_partition_access: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # ESP32 already defaults to LIGHT modem sleep. HIGH saves more RF power;
  # if your AP proves unreliable, change this back to LIGHT.
  power_save_mode: HIGH
  ap:
    ssid: "I2CSniffer Fallback Hotspot"
    password: !secret i2csniffer__ap_password

captive_portal:

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf
  # Persistent Sensirion history store. This is storage configuration rather
  # than GATT protocol configuration; the bus_sniffer component owns the format.
  partitions:
    - name: senshist
      type: data
      subtype: spiffs
      size: 0x10000

# User-facing BLE configuration only.  Sensirion services/characteristics,
# callbacks, System ID and history protocol are created by bus_sniffer itself.
esp32_ble:
  id: unni_ble
  name: "S"
  advertising: true

esp32_ble_server:
  id: unni_ble_server
  max_clients: 1
  manufacturer: "Sensirion"
  model: "MyCO2 Gadget"
  firmware_version: "1.0.0"

web_server:
  port: 80

bus_sniffer:
  # Compile-time BLE feature selection.
  # For a genuine ble:false build, also remove/comment the top-level
  # esp32_ble: and esp32_ble_server: blocks above.
  ble: true
  ble_live: true
  ble_history: true
  ble_id: unni_ble
  ble_server_id: unni_ble_server

  ble_advertising_interval: 2s
  ha_publish_interval: 30s

  co2:
    name: "CO2"
    id: cd40_co2
    icon: mdi:molecule-co2

  crc_errors:
    name: "CO2 Sniffer CRC Errors"

  frame_errors:
    name: "CO2 Sniffer Frame Errors"

  rt_temperature:
    name: "RT Temperature"
    id: rt_temperature
    icon: mdi:thermometer

  rh_humidity:
    name: "RH Humidity"
    id: rh_humidity
    icon: mdi:water-percent

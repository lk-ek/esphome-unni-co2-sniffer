esphome:
  name: i2csniffer
  friendly_name: I2C-Sniffer

external_components:
  - source:
      type: local
      path: .

logger:
  level: INFO

api:
  encryption:
    key: !secret i2csniffer__encryption_key

ota:
  - platform: esphome
    password: !secret i2csniffer__ota

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "I2CSniffer Fallback Hotspot"
    password: !secret i2csniffer__ap_password

captive_portal:

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

# BLE host used by the custom Sensirion MyCO2 manufacturer advertisement.
# No GATT server is required for live broadcasts.
esp32_ble:
  name: "S-Unni-CO2"
  advertising: true

# Sensirion Gadgets are connectable GATT servers in addition to broadcasting
# live measurements in manufacturer data.  Use ESPHome's native ESP-IDF BLE
# server rather than loading a second NimBLE-Arduino stack.
#
# ESPHome automatically exposes its Device Information service here.
esp32_ble_server:
  manufacturer: "Sensirion"
  model: "MyCO2 Gadget"
  max_clients: 1
  on_connect:
    - lambda: |-
        ESP_LOGI("sensirion_gatt", "BLE GATT client connected: id=%u",
                 static_cast<unsigned>(id));
  on_disconnect:
    - lambda: |-
        ESP_LOGI("sensirion_gatt", "BLE GATT client disconnected: id=%u",
                 static_cast<unsigned>(id));

web_server:
  port: 80

bus_sniffer:
  co2:
    name: "CO2"
    id: cd40_co2
    icon: mdi:molecule-co2

  crc_errors:
    name: "CO2 Sniffer CRC Errors"

  frame_errors:
    name: "CO2 Sniffer Frame Errors"

  rt_temperature:
    name: "RT Temperature"
    id: rt_temperature
    icon: mdi:thermometer

  rh_humidity:
    name: "RH Humidity"
    id: rh_humidity
    icon: mdi:water-percent

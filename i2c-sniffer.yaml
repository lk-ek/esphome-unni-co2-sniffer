esphome:
  name: i2csniffer
  friendly_name: I2C-Sniffer

external_components:
  - source:
      type: local
      path: .

logger:
  level: WARN

api:
  reboot_timeout: 0s
  encryption:
    key: !secret i2csniffer__encryption_key

ota:
  - platform: esphome
    password: !secret i2csniffer__ota
    allow_partition_access: true
    on_begin:
      then:
        - lambda: id(unni_co2_monitor).prepare_for_ota();

wifi:
  reboot_timeout: 0s
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Keep Wi-Fi modem sleep conservative while automatic MCU Light-sleep is used.
  # HIGH/MAX_MODEM proved unreliable on this ESP32-C3/AP combination.
  power_save_mode: LIGHT
  # Keep the normal Wi-Fi scan so the stationary device can select the best
  # available AP instead of using ESPHome's fast-connect shortcut.
  fast_connect: false
  # Stationary device with multiple APs: avoid disruptive BSSID roaming.
  post_connect_roaming: false
  ap:
    ssid: "I2CSniffer Fallback Hotspot"
    password: !secret i2csniffer__ap_password

captive_portal:

# Wall clock for sparse persistent history anchors. Home Assistant is the
# preferred ESPHome time source for these API-enabled variants.
time:
  - platform: homeassistant
    id: unni_wall_clock

# Match the SHT43 DemoBoard security model closely enough to probe
# MyAmbience pairing and Device Settings behavior.
esp32_ble:
  io_capability: display_yes_no
  auth_req_mode: sc_mitm_bond
  min_key_size: 10
  max_key_size: 16

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

sensirion_gadget_bridge:
  id: unni_sensirion_bridge
  profile: trh_co2
  history_time_id: unni_wall_clock
  ble: true
  ble_live: true
  ble_history: true
  device_name: "Unni CO2 Monitor"
  advertising_interval: 2s

co2_monitor_0601:
  sensirion_bridge_id: unni_sensirion_bridge
  history_time_id: unni_wall_clock
  id: unni_co2_monitor
  ble_device_name: "Unni CO2 Monitor"
  home_assistant: true
  # Force battery-style runtime policy while physically powered by USB.
  # Toggle the Energy Save Mode switch in Home Assistant for power measurements.
  energy_save_mode_default: false
  # Keep HA/API reachable briefly before Light-sleep may drop native USB serial.
  energy_save_grace: 3s
  sniffer_start_delay: 10s
  # Production entity set: CO2, Temperature, Humidity and power/battery state.
  # RT-model, Unni-display and protocol/timing entities are debug-build only.
  debug_metrics: false
  debug_capture: false

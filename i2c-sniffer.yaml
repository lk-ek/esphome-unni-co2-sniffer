esphome:
  name: i2csniffer
  friendly_name: I2C-Sniffer
  includes:
    - <esp_mac.h>

external_components:
  - source:
      type: local
      path: .

logger:
  level: INFO

api:
  encryption:
    key: !secret i2csniffer__encryption_key

ota:
  - platform: esphome
    password: !secret i2csniffer__ota

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "I2CSniffer Fallback Hotspot"
    password: !secret i2csniffer__ap_password

captive_portal:

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

# BLE host used by the custom Sensirion MyCO2 manufacturer advertisement.
# No GATT server is required for live broadcasts.
esp32_ble:
  name: "S-Unni-CO2"
  advertising: true

# Sensirion Gadgets are connectable GATT servers in addition to broadcasting
# live measurements in manufacturer data.  Use ESPHome's native ESP-IDF BLE
# server rather than loading a second NimBLE-Arduino stack.
#
# ESPHome automatically exposes its Device Information service here.
esp32_ble_server:
  max_clients: 1

  # Define 0x180A explicitly so it contains exactly the MyCO2-supported
  # Device Information characteristics from the Sensirion table.
  services:
    - uuid: 0x180A
      advertise: false
      characteristics:
        - uuid: 0x2A29
          read: true
          value:
            data: "Sensirion"
            type: string

        - uuid: 0x2A24
          read: true
          value:
            data: "MyCO2 Gadget"
            type: string

        - uuid: 0x2A26
          read: true
          value:
            data: "1.0.0"
            type: string

        - uuid: 0x2A23
          read: true
          value:
            data: !lambda |-
              uint8_t mac[6] = {0};
              esp_err_t err = esp_read_mac(mac, ESP_MAC_BT);
              if (err != ESP_OK) {
                ESP_LOGE("sensirion_gatt",
                         "esp_read_mac(ESP_MAC_BT) failed: %d",
                         static_cast<int>(err));
                return std::vector<uint8_t>({0, 0, 0, 0, 0, 0});
              }
              return std::vector<uint8_t>(mac, mac + 6);

  on_connect:
    - lambda: |-
        uint8_t mac[6] = {0};
        esp_err_t err = esp_read_mac(mac, ESP_MAC_BT);
        if (err == ESP_OK) {
          ESP_LOGI("sensirion_gatt",
                   "BLE GATT client connected: id=%u, System ID/MAC "
                   "%02X:%02X:%02X:%02X:%02X:%02X",
                   static_cast<unsigned>(id),
                   mac[0], mac[1], mac[2],
                   mac[3], mac[4], mac[5]);
        } else {
          ESP_LOGI("sensirion_gatt",
                   "BLE GATT client connected: id=%u",
                   static_cast<unsigned>(id));
        }

  on_disconnect:
    - lambda: |-
        ESP_LOGI("sensirion_gatt", "BLE GATT client disconnected: id=%u",
                 static_cast<unsigned>(id));

web_server:
  port: 80

bus_sniffer:
  co2:
    name: "CO2"
    id: cd40_co2
    icon: mdi:molecule-co2

  crc_errors:
    name: "CO2 Sniffer CRC Errors"

  frame_errors:
    name: "CO2 Sniffer Frame Errors"

  rt_temperature:
    name: "RT Temperature"
    id: rt_temperature
    icon: mdi:thermometer

  rh_humidity:
    name: "RH Humidity"
    id: rh_humidity
    icon: mdi:water-percent

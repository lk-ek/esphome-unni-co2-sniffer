#
# Permanently powered AHT21-only variant. Sensirion BLE live data and persistent
# history are identical to mobilesensor-sensirion.yaml, but no ENS160 component,
# raw I2C control, switch, or air-quality entity is instantiated.

esphome:
  name: mobilesensor
  friendly_name: mobilesensor


external_components:
  - source:
      type: local
      path: .


esp32:
  board: wemos_d1_mini32
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true


logger:
  level: DEBUG


api:
  encryption:
    key: !secret mobilesensor_api


ota:
  - platform: esphome
    password: !secret mobilesensor_ota
    allow_partition_access: true
    on_begin:
      then:
        - lambda: id(sensirion_bridge).prepare_for_ota();


wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Mobilesensor Fallback Hotspot"
    password: !secret mobilesensor_ap_password


captive_portal:


time:
  - platform: homeassistant
    id: mobilesensor_wall_clock


esp32_ble:
  io_capability: display_yes_no
  auth_req_mode: sc_mitm_bond
  min_key_size: 10
  max_key_size: 16


# History is fed only by these AHT21 source IDs. No ENS160 state participates
# in sample completeness, cadence, flash persistence, or history download.
co2_monitor_0601:
  id: sensirion_bridge
  standalone_sensirion_mode: true
  sensirion_profile: sht43_trh
  sht43_identity_probe: true
  sensirion_temperature_id: aht21_temp
  sensirion_humidity_id: aht21_humi
  history_time_id: mobilesensor_wall_clock

  ble: true
  ble_live: true
  ble_history: true
  ble_advertising_interval: 2s

  home_assistant: true
  sniffer_enabled: false
  rtrh_enabled: false
  rtrh_gpio_setup: false
  rtrh_edge_capture: false
  rtrh_decode_only: false
  active_i2c_probe: false
  light_sleep: false
  debug_metrics: false
  runtime_diagnostics: false


i2c:
  sda: GPIO23
  scl: GPIO19
  scan: true
  frequency: 100kHz


sensor:
  - platform: aht10
    id: aht21_sensor
    address: 0x38

    temperature:
      name: "AHT21 Temperature"
      id: aht21_temp

    humidity:
      name: "AHT21 Humidity"
      id: aht21_humi

    update_interval: 5s


binary_sensor:
  - platform: status
    name: "Status"
    id: mobilesensor_status

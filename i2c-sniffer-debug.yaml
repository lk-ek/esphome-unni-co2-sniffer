esphome:
  name: i2csniffer
  friendly_name: I2C-Sniffer

external_components:
  - source:
      type: local
      path: .

logger:
  level: DEBUG
  initial_level: DEBUG

api:
  reboot_timeout: 0s
  # Flash-backed BLE history leaves enough RAM for Home Assistant plus one
  # temporary native API client (for example `esphome logs`).
  max_connections: 2
  encryption:
    key: !secret i2csniffer__encryption_key

ota:
  - platform: esphome
    password: !secret i2csniffer__ota
    allow_partition_access: true
    on_begin:
      then:
        - lambda: id(unni_co2_monitor).prepare_for_ota();

wifi:
  reboot_timeout: 0s
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Keep Wi-Fi modem sleep conservative while automatic MCU Light-sleep is used.
  # HIGH/MAX_MODEM proved unreliable on this ESP32-C3/AP combination.
  power_save_mode: LIGHT
  # Keep the normal Wi-Fi scan so the stationary device can select the best
  # available AP instead of using ESPHome's fast-connect shortcut.
  fast_connect: false
  # Stationary device with multiple APs: avoid disruptive BSSID roaming.
  post_connect_roaming: false
  ap:
    ssid: "I2CSniffer Fallback Hotspot"
    password: !secret i2csniffer__ap_password

captive_portal:

# Wall clock for sparse persistent history anchors. Home Assistant is the
# preferred ESPHome time source for these API-enabled variants.
time:
  - platform: homeassistant
    id: unni_wall_clock


# Match the SHT43 DemoBoard security model closely enough to probe
# MyAmbience pairing and Device Settings behavior.
esp32_ble:
  io_capability: display_yes_no
  auth_req_mode: sc_mitm_bond
  min_key_size: 10
  max_key_size: 16

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

co2_monitor_0601:
  history_time_id: unni_wall_clock
  id: unni_co2_monitor
  ble_device_name: "Unni CO2 Monitor"
  home_assistant: true
  # Force battery-style runtime policy while physically powered by USB.
  # Toggle the Energy Save Mode switch in Home Assistant for power measurements.
  energy_save_mode_default: false
  # Keep HA/API reachable briefly before Light-sleep may drop native USB serial.
  energy_save_grace: 3s
  sniffer_start_delay: 10s
  # Battery policy: sleep between native sensor windows. RT/RH remains a wake
  # source; when the CO2 bus is quiet LOW/LOW, SCL HIGH is armed as an
  # additional wake source for the next native CO2 power window.
  light_sleep: true
  # Expose the complete entity set, including RT-model, Unni-display,
  # protocol error, timing, quality and extrapolation diagnostics.
  debug_metrics: true
  runtime_diagnostics: true
  i2c_capture_backend: rmt_scl
  # Active bus takeover was diagnostic-only; normal battery operation is fully passive.
  active_i2c_probe: false
  active_i2c_probe_interval: 60s
  debug_capture: true
  debug_udp_host: 10.0.42.149
  debug_udp_port: 45678

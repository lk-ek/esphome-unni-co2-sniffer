esphome:
  name: i2csniffer
  friendly_name: I2C-Sniffer

external_components:
  - source:
      type: local
      path: .

logger:
  level: WARN

api:
  encryption:
    key: !secret i2csniffer__encryption_key

ota:
  - platform: esphome
    password: !secret i2csniffer__ota
    allow_partition_access: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Keep Wi-Fi modem sleep conservative while automatic MCU Light-sleep is used.
  # HIGH/MAX_MODEM proved unreliable on this ESP32-C3/AP combination.
  power_save_mode: LIGHT
  # Skip the normal active channel scan on reconnect/boot. ESPHome falls back
  # to scanning automatically if the remembered AP cannot be reached.
  fast_connect: false
  # Stationary device with multiple APs: avoid disruptive BSSID roaming.
  post_connect_roaming: false
  ap:
    ssid: "I2CSniffer Fallback Hotspot"
    password: !secret i2csniffer__ap_password

captive_portal:

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf
# BLE deliberately omitted for timing A/B test.

co2_monitor_0601:
  home_assistant: true
  # Force battery-style runtime policy while physically powered by USB.
  # Toggle the Energy Save Mode switch in Home Assistant for power measurements.
  energy_save_mode_default: false
  # Keep HA/API reachable briefly before Light-sleep may drop native USB serial.
  energy_save_grace: 3s
  ble: false
  ble_live: false
  ble_history: false
  sniffer_start_delay: 10s
  debug_metrics: false
  debug_capture: false
